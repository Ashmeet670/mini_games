<!DOCTYPE html>
<html lang="en">

    <head>


        <title>Mini-Games</title>

        <!-- bootstrap -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0-beta1/dist/css/bootstrap.min.css" rel="stylesheet"
            integrity="sha384-0evHe/X+R7YkIZDRvuzKMRqM+OrBnVFBL6DOitfPri4tjfHxaWutUpFmBp4vmVor" crossorigin="anonymous">

        <!-- allows for responsive view -->
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <!-- Bootstrap Icons -->
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.min.css">

        <!--Stylesheets --->
        <link rel="stylesheet" href="style.css">


    </head>


    <body class="">

        <!-- title bar -->
        <div class="m-0 d-flex justify-content-between align-items-center">

            <div class="titleText m-3 m-lg-5">MINI-GAMES</div>


            <!-- layout selector -->
            <div id="layoutBox" class="m-3 m-lg-5 d-flex p-1 rounded-3"
                onclick="toggle(document.getElementById('layout1'),document.getElementById('layout2'))">

                <!-- selector -->
                <div id="layout2" class="layoutSubBox p-3 rounded-1  ">
                    <svg aria-hidden="true" width="23" height="23" viewBox="0 0 30 28">
                        <rect x="1" y="7" width="6" height="12" rx="2" fill="currentColor" opacity=".6"></rect>
                        <rect x="9" y="2" width="12" height="22" rx="3" fill="currentColor"></rect>
                        <rect x="23" y="7" width="6" height="12" rx="2" fill="currentColor" opacity=".6"></rect>
                    </svg>
                </div>


                <!-- grid -->
                <div id="layout1" class="layoutSubBox p-3 rounded-1 d-none">
                    <svg aria-hidden="true" width="23" height="23" viewBox="0 0 26 26">
                        <rect x="2" y="2" width="9" height="9" rx="2" fill="currentColor"></rect>
                        <rect x="15" y="2" width="9" height="9" rx="2" fill="currentColor"></rect>
                        <rect x="2" y="15" width="9" height="9" rx="2" fill="currentColor"></rect>
                        <rect x="15" y="15" width="9" height="9" rx="2" fill="currentColor"></rect>
                    </svg>
                </div>

            </div>

        </div>



        <div style="height: 5vh;"></div>

        <!-- Game list -->
        <div id="cards" class="d-flex justify-content-center align-items-end">
            <section class="gameCard gcll">
                <img id="1" class="gameImg rounded-3" src="" alt="">
            </section>
            <section class="gameCard gcl">
                <img id="2" class="gameImg rounded-3" src="" alt="">
            </section>
            <section class="gameCard gcc mx-3">
                <img id="3" class="gameImg rounded-3 selected" src="" alt="">
            </section>
            <section class="gameCard gcr">
                <img id="4" class="gameImg rounded-3" src="" alt="">
            </section>
            <section class="gameCard gcrr">
                <img id="5" class="gameImg rounded-3" src="" alt="">
            </section>
        </div>


        
        <div class="text-center justify-content-center">
            <div id="gameName" class="gameText mt-5 text-center">Sodoku</div>
            <div id="gamePlayers" class="gameText2 my-1 text-center">1 Player</div>
            <div class="gamePlay mx-auto my-3 p-1 rounded-2 text-center" onclick="playGame()" >
                <div class="textHighlightPlay px-4 py-1 rounded-1">PLAY</div></div>
            <a id="goToPlay" target="_" class="d-none" href=""></a>
        </div>


    </body>


    <script src="app.js"></script>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0-beta1/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-pprn3073KE6tl6bjs2QrFaJGz5/SUsLqktiwsUTF55Jfv3qYSDhgCecCxMW52nD2"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.5/dist/umd/popper.min.js"
        integrity="sha384-Xe+8cL9oJa6tN/veChSP7q+mnSPaj5Bcu9mPX5F5xIGE0DVittaqT5lorf0EI7Vk"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0-beta1/dist/js/bootstrap.min.js"
        integrity="sha384-kjU+l4N0Yf4ZOJErLsIcvOU2qSb74wXpOhqTvwVx3OElZRweTnQ6d31fXEoRD1Jy"
        crossorigin="anonymous"></script>


</html>
